# Registre des features — Crypto Lab (spec §28)
# Règle absolue : feature_timestamp ≤ t0. Toute feature dont la mesure nécessite
# une observation postérieure à t0 est une FUITE → DEPRECATED, jamais réutilisée.
# Fichier créé le 2026-09-28 (branche feat/deku-cupsey, aucun push).
#
# Sources :
# - lab/predictive/earlybuyers/types.ts (FIXED_FEATURES, 22 features Phase 2)
# - lab/predictive/flows/features.ts (14 features Phase 1)
# - lab/predictive/liquidity/features.ts (10 features Phase 1)
# - lab/predictive/temporal/features.ts (9 features Phase 1)
# Statuts : ACTIVE · DEPRECATED

