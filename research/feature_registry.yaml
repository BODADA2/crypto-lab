  # ------------------------------------------------- DÉPRÉCIÉES (fuite)
  - id: sellersOver50
    desc: "Nombre de wallets ayant vendu >50 % à +5 min post-migration (rétention)"
    source_module: lab/predictive/wallets/features.ts
    source_data: "data/earlybuyers/ (sells — backfill défaillant, walletsCovered=0)"
    timestamp_field: "+5 min post-migration — POSTÉRIEUR à t0"
    version: "DEPRECATED 2026-09-28"
    status: DEPRECATED
    deprecation_reason: >-
      FUITE : mesurée à +5 min APRÈS la migration (donc après t0), non observable
      au moment de la décision. Utilisée en Phase 1 (H-PRED-WAL-07) — interdite
      en Phase 2 (audit anti-fuite). Données quasi absentes de toute façon
      (échecs Helius −32015 côté backfill). Ne jamais ressusciter.

  - id: medianSoldFrac
    desc: "soldFrac médian des wallets couverts à +5 min post-migration (rétention)"
    source_module: lab/predictive/wallets/features.ts
    source_data: "data/earlybuyers/ (sells — backfill défaillant)"
    timestamp_field: "+5 min post-migration — POSTÉRIEUR à t0"
    version: "DEPRECATED 2026-09-28"
    status: DEPRECATED
    deprecation_reason: >-
      FUITE : même raison que sellersOver50 — observation post-t0, non observable
      à la décision. H-PRED-WAL-07 est en suspens jusqu'à une définition
      point-in-time (≤ t0) ET un backfill sells fonctionnel.
